services:
  app:
    build:
      context: .
      target: prod
    working_dir: /app
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obrigatoria}
      AUTH_SECRET: ${AUTH_SECRET:-replace-me-with-a-random-secret}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_URL: ${AUTH_URL:-http://localhost:3001}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      CATWORLD_SERVICE_URL: ${CATWORLD_SERVICE_URL:-http://catworld-service:8001}
      CATWORLD_BASE_URL: ${CATWORLD_BASE_URL:-}
      CATWORLD_TOKEN: ${CATWORLD_TOKEN:-}
      SUPER77_EMAIL: ${SUPER77_EMAIL:-super77@77.local}
      SUPER77_PASSWORD: ${SUPER77_PASSWORD:-super77-dev-password}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${APP_PORT:-3001}:3000"
    depends_on:
      catworld-service:
        condition: service_started

  catworld-service:
    build:
      context: ./services/catworld
    environment:
      CATWORLD_TIMEOUT: "30"
    ports:
      - "${CATWORLD_SERVICE_PORT:-8001}:8001"
