services:
  postgres:
    build:
      context: ./services/postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: 77system
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d 77system"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: prod
    working_dir: /app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/77system?schema=public&connection_limit=5&pool_timeout=20}
      AUTH_SECRET: ${AUTH_SECRET:-replace-me-with-a-random-secret}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_URL: ${AUTH_URL:-http://localhost:3001}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      CATWORLD_SERVICE_URL: ${CATWORLD_SERVICE_URL:-http://catworld-service:8001}
      SUPER77_EMAIL: ${SUPER77_EMAIL:-super77@77.local}
      SUPER77_PASSWORD: ${SUPER77_PASSWORD:-super77-dev-password}
    ports:
      - "${APP_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      catworld-service:
        condition: service_started

  worker:
    build:
      context: .
      target: prod
    working_dir: /app
    command: ["sh", "-c", "while true; do pnpm data:worker; sleep 30; done"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/77system?schema=public&connection_limit=5&pool_timeout=20}
      CATWORLD_SERVICE_URL: ${CATWORLD_SERVICE_URL:-http://catworld-service:8001}
    depends_on:
      postgres:
        condition: service_healthy
      catworld-service:
        condition: service_started
    restart: unless-stopped

  catworld-service:
    build:
      context: ./services/catworld
    environment:
      CATWORLD_TIMEOUT: "30"
    ports:
      - "${CATWORLD_SERVICE_PORT:-8001}:8001"

volumes:
  postgres-data:
