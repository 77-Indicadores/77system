services:
  postgres:
    build:
      context: ./services/postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: 77system
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql -U postgres -d 77system -v ON_ERROR_STOP=1 -v password=\"$$POSTGRES_PASSWORD\" -c \"ALTER USER postgres WITH PASSWORD :'password';\" && pg_isready -U postgres -d 77system"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    extends:
      file: docker-compose.yml
      service: app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/77system?schema=public&connection_limit=5&pool_timeout=20}
    depends_on:
      postgres:
        condition: service_healthy
      catworld-service:
        condition: service_started

  catworld-service:
    extends:
      file: docker-compose.yml
      service: catworld-service

volumes:
  postgres-data:
